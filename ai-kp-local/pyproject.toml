[project]
name = "ai-kp-local"
version = "0.1.0"
description = "Local-first AI keeper platform for tabletop RPG campaigns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=6.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]
rulebook = [
  "minirag-hku @ git+https://github.com/HKUDS/MiniRAG.git@e204d239421f45004852953679927fdf6733f236",
  "json-repair>=0.50.0",
  "nano-vectordb>=0.0.4.3",
  "networkx>=3.4.0",
  "nltk>=3.9.0",
  "numpy>=2.0.0",
  "pipmaster>=1.0.0",
  "rouge>=1.0.1",
  "scikit-learn>=1.6.0",
  "sentence-transformers>=5.0.0",
  "tiktoken>=0.9.0",
  "xxhash>=3.5.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
